<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Apply a saved light/dark choice before first paint so the themed
         background shows instantly, with no flash of the wrong theme while the
         app loads. No stored choice → the CSS prefers-color-scheme query wins. -->
    <script>
      try {
        var t = localStorage.getItem('monitor-comparison:theme:v1')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NG529HTHZZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-NG529HTHZZ');
    </script>
    <title>Monitorture — Compare Monitor Sizes Side by Side</title>
    <meta
      name="description"
      content="Because choosing a monitor is hard. Compare monitor sizes side by side, drawn to scale — resolution, aspect ratio, PPI, and curvature."
    />
    <link rel="canonical" href="https://monitorture.com/" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="./icon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-dark-192.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a19" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, iMessage…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Monitorture" />
    <meta property="og:title" content="Monitorture — Compare Monitor Sizes Side by Side" />
    <meta
      property="og:description"
      content="Because choosing a monitor is hard. Compare monitor sizes side by side, drawn to scale — resolution, aspect ratio, PPI, and curvature."
    />
    <meta property="og:url" content="https://monitorture.com/" />
    <meta property="og:image" content="https://monitorture.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Monitorture — Compare Monitor Sizes Side by Side" />
    <meta
      name="twitter:description"
      content="Because choosing a monitor is hard. Compare monitor sizes side by side, drawn to scale — resolution, aspect ratio, PPI, and curvature."
    />
    <meta name="twitter:image" content="https://monitorture.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
