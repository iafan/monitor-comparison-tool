<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Monitorture">
  <!-- RGB test bars: full bleed, equal width -->
  <rect x="0" y="0" width="400" height="1200" fill="#ff0000"/>
  <rect x="400" y="0" width="400" height="1200" fill="#00ff00"/>
  <rect x="800" y="0" width="400" height="1200" fill="#0000ff"/>

  <!-- Test-card screen: everything above the two rays -->
  <defs>
    <clipPath id="screen">
      <path d="M0 0 H1200 V360 L600 600 L0 360 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#screen)">
    <rect x="0" y="0" width="1200" height="1200" fill="#ffffff"/>
    <g fill="none" stroke="#000000" stroke-width="26">
      <g stroke-opacity="0.9">
        <line x1="200" y1="0" x2="200" y2="1200"/>
        <line x1="400" y1="0" x2="400" y2="1200"/>
        <line x1="600" y1="0" x2="600" y2="1200"/>
        <line x1="800" y1="0" x2="800" y2="1200"/>
        <line x1="1000" y1="0" x2="1000" y2="1200"/>
        <line x1="0" y1="200" x2="1200" y2="200"/>
        <line x1="0" y1="400" x2="1200" y2="400"/>
        <line x1="0" y1="600" x2="1200" y2="600"/>
        <line x1="0" y1="800" x2="1200" y2="800"/>
        <line x1="0" y1="1000" x2="1200" y2="1000"/>
      </g>
      <circle cx="600" cy="600" r="290"/>
      <circle cx="600" cy="600" r="528"/>
    </g>
  </g>

  <!-- M: rays meeting at the icon center + bar-seam outlines -->
  <g fill="none" stroke="#000000" stroke-width="26" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="0,360 600,600 1200,360"/>
    <line x1="400" y1="520" x2="400" y2="1200"/>
    <line x1="800" y1="520" x2="800" y2="1200"/>
  </g>
</svg>
